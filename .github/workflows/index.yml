name: 索引链上靓号数据

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: index-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: 运行索引器
        env:
          BSCSCAN_API_KEY: ${{ secrets.BSCSCAN_API_KEY }}
        run: node scripts/index.mjs

      - name: 提交数据变更
        run: |
          if git diff --quiet -- data/ 2>/dev/null && [ -z "$(git status --porcelain data/)" ]; then
            echo "data/ 无变更,跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: 更新链上靓号索引数据 [skip ci]"
          git push
