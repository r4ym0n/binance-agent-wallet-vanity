name: 索引链上靓号数据

# 自愈链:索引器只在有实质数据变化时才提交(见 scripts/index.mjs 的
# stats.json 条件写入),提交 → push 触发下一轮,直到追平链头后链条自然
# 停歇;schedule 每 15 分钟兜底唤醒一次。勿恢复无条件写 data/.chain-ts
# 的方案 —— 会在追平后无限空转、刷爆提交与 Vercel 构建队列。
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/**"

concurrency:
  group: index-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # 必须用 PAT 而非默认 GITHUB_TOKEN:GITHUB_TOKEN 产生的 push 事件
          # 不会触发 workflow(防递归保护),自愈链会断;PAT 推送才会触发下一轮
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: 运行索引器
        env:
          BSC_RPC_URLS: ${{ secrets.BSC_RPC_URLS }}
          INDEX_MAX_CALLS: 1200
          INDEX_TIME_BUDGET_MS: 840000
        run: node scripts/index.mjs

      # push 前先 rebase:push 触发与 schedule 触发的运行可能基于同一旧提交,
      # 链上已有新提交时直接 push 会被拒(曾因竞态断链)。
      # 部署频率控制:只有 vanity.json 有变化(新收录靓号)才提交部署;否则
      # 距上次数据提交满 2 小时兜底提交一次(保持首页同步时间新鲜)。
      # 曾每次 lastIndexedBlock 前进都提交 → 每天近百次全量部署。
      - name: 提交数据变更并推送(有新收录或 2h 心跳才部署)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          VANITY_CHANGED=no
          git diff --cached --name-only data/ | grep -q '^data/vanity\.json$' && VANITY_CHANGED=yes
          LAST_DATA_COMMIT=$(git log -1 --format=%ct -- data/ || echo 0)
          HEARTBEAT_DUE=$(( $(date +%s) - ${LAST_DATA_COMMIT:-0} > 7200 ))
          if { [ "$VANITY_CHANGED" = "yes" ] || [ "$HEARTBEAT_DUE" = "1" ]; } && [ -n "$(git status --porcelain data/)" ]; then
            git commit -m "chore: 更新链上靓号索引数据"
            # push 竞态重试:并发的链上运行可能已推新提交,直接 rebase 偶发冲突。
            # 重试仍失败则放弃本轮(下一轮从远端 state.json 继续,数据不丢),
            # 不再让整轮运行变红。
            PUSHED=no
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then
                PUSHED=yes
                break
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 5))
            done
            if [ "$PUSHED" = "no" ]; then
              echo "::warning::本轮 push 重试后仍失败,放弃(下一轮自动补)"
            fi
          else
            echo "无新收录且距上次数据提交不足 2h,跳过提交(链条本轮停歇)"
          fi
